# yaml-language-server: $schema=https://raw.githubusercontent.com/spachava753/cpe/refs/heads/main/schema/cpe-config-schema.json
version: "1.0"

# CPE only supports version and models at the root. Define shared YAML anchors
# on their first model use below, rather than in a separate top-level block.
# Each profile keeps its provider, pricing, and prompt settings explicit.
models:
  # Astra: thinking is always enabled; defaults to high.
  - ref: gpt
    display_name: GPT 6 Astra
    id: gpt-6-astra
    type: responses
    base_url: https://chatgpt.com/backend-api/codex
    api_key_env: ""
    auth_method: oauth
    context_window: 372000
    max_output: 128000
    input_cost_per_million: 10
    output_cost_per_million: 50
    cache_read_cost_per_million: 1
    cache_write_cost_per_million: 12.50
    # Astra does not support none. Sol and Luna define their own shared list below.
    thinkingValues:
      - value: low
        name: Low
      - value: medium
        name: Medium
      - value: high
        name: High
      - value: xhigh
        name: Extra High
      - value: max
        name: Max
    patchRequest:
      # Astra-only request override; not shared with Sol or Luna.
      jsonPatch:
        - op: add
          path: /parallel_tool_calls
          value: false
    systemPromptPath: astra_instructions.md
    generationParams:
      thinkingBudget: high

    # Shared runtime settings, reused by every profile below.
    timeout: &standardTimeout 1h
    codeMode: &standardCodeMode
      enabled: true
      largeOutputCharLimit: 150000
      maxTimeout: 3600
    compaction: &standardCompaction
      autoTriggerThreshold: 0.75
      initialMessageTemplate: |-
        The conversation was compacted. Use the handoff below to resume the current task.

        Current task and latest user instruction:
        {{index .ToolArguments "currentTask"}}
        {{with index .ToolArguments "constraints"}}

        Scope, corrections, and approval limits:
        {{range .}}- {{.}}
        {{end}}{{end}}

        Current state and remaining work:
        {{index .ToolArguments "summary"}}
        {{with index .ToolArguments "keyPoints"}}

        Findings and decisions:
        {{range .}}- {{.}}
        {{end}}{{end}}{{with index .ToolArguments "completedWork"}}

        Completed work and verification status:
        {{range .}}- {{.}}
        {{end}}{{end}}{{with index .ToolArguments "artifacts"}}

        Artifacts and recovery references:
        {{range .}}- {{.}}
        {{end}}{{end}}{{with index .ToolArguments "openQuestions"}}

        Open questions and blockers:
        {{range .}}- {{.}}
        {{end}}{{end}}

        Proposed next action:
        {{index .ToolArguments "nextAction"}}

        Continue the current task. If you need more context, search the saved
        conversation with acp.get_session(). Files are unchanged; REPL state is gone.
      inputSchema:
        properties:
          currentTask:
            description: The latest user request, including whether to analyze, plan, or implement.
            type: string
          constraints:
            description: Scope limits, user corrections, rejected approaches, and current approval limits. Use an empty list if none apply.
            items:
              type: string
            type: array
          artifacts:
            description: Files, branches, commits, saved outputs, and other references needed to resume.
            items:
              type: string
            type: array
          completedWork:
            description: Work completed and checks run, with results. Note whether changes are committed or uncommitted.
            items:
              type: string
            type: array
          keyPoints:
            description: Findings, decisions, assumptions, preferences, and required skills. Mark superseded decisions.
            items:
              type: string
            type: array
          nextAction:
            description: The next step, including any clarification or approval needed first.
            type: string
          openQuestions:
            description: Unresolved questions and blockers.
            items:
              type: string
            type: array
          summary:
            description: Current state and remaining work, including important details not saved elsewhere.
            type: string
        required:
          - currentTask
          - constraints
          - summary
          - nextAction
        type: object
      maxAutoCompactionRestarts: 50
      toolDescription: Start a fresh linked session with the supplied handoff when the user requests compaction or COMPACTION WARNING appears.

  # Sol: defines the thinking choices and prompt shared with Luna.
  - ref: sol
    display_name: GPT 5.6 Sol
    id: gpt-5.6-sol
    type: responses
    base_url: https://chatgpt.com/backend-api/codex
    api_key_env: ""
    auth_method: oauth
    context_window: 372000
    max_output: 128000
    input_cost_per_million: 4
    output_cost_per_million: 20
    cache_read_cost_per_million: 0.40
    cache_write_cost_per_million: 5.0
    thinkingValues: &openAIThinkingValues
      - value: none
        name: None
      - value: low
        name: Low
      - value: medium
        name: Medium
      - value: high
        name: High
      - value: xhigh
        name: Extra High
      - value: max
        name: Max
    systemPromptPath: &gptPrompt gpt_instructions.md
    timeout: *standardTimeout
    codeMode: *standardCodeMode
    compaction: *standardCompaction

  # Luna: reuses Sol's thinking choices and prompt.
  - ref: luna
    display_name: GPT 5.6 Luna
    id: gpt-5.6-luna
    type: responses
    base_url: https://chatgpt.com/backend-api/codex
    api_key_env: ""
    auth_method: oauth
    context_window: 372000
    max_output: 128000
    input_cost_per_million: 1
    output_cost_per_million: 6
    cache_read_cost_per_million: 0.1
    cache_write_cost_per_million: 1.25
    thinkingValues: *openAIThinkingValues
    systemPromptPath: *gptPrompt
    timeout: *standardTimeout
    codeMode: *standardCodeMode
    compaction: *standardCompaction

  # Kimi: always-on thinking, with no selectable thinkingValues.
  - ref: kimi
    display_name: Kimi K2.7 Code
    id: kimi-k2.7-code
    type: anthropic
    # Custom provider API root; CPE appends /v1/messages.
    base_url: https://gateway.ai.cloudflare.com/v1/4eee6dd2fdc8cebc7802c5a638f460fe/cpe/custom-moonshot-anthropic/anthropic
    api_key_env: MOONSHOT_API_KEY
    context_window: 262144
    max_output: 128000
    input_cost_per_million: 0.95
    output_cost_per_million: 4.00
    cache_read_cost_per_million: 0.19
    # This endpoint requires explicit thinking even though the model always thinks.
    patchRequest:
      jsonPatch:
        - op: add
          path: /thinking
          value:
            type: enabled
    systemPromptPath: &agentPrompt agent_instructions.md
    timeout: *standardTimeout
    codeMode: *standardCodeMode
    compaction: *standardCompaction
    generationParams:
      maxGenerationTokens: 128000

  # GLM: direct Anthropic-compatible endpoint, with thinking enabled by the patch.
  - ref: glm
    display_name: GLM 5.2
    id: glm-5.2
    type: anthropic
    base_url: https://api.z.ai/api/anthropic
    api_key_env: Z_API_KEY
    context_window: 1000000
    max_output: 128000
    input_cost_per_million: 1.40
    output_cost_per_million: 4.40
    cache_read_cost_per_million: 0.26
    patchRequest:
      jsonPatch:
        - op: add
          path: /thinking
          value:
            type: enabled
    systemPromptPath: *agentPrompt
    timeout: *standardTimeout
    codeMode: *standardCodeMode
    compaction: *standardCompaction
    generationParams:
      maxGenerationTokens: 128000
